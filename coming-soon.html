<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Location Opening Soon — IRON & IVORY Studio</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Favicon & Theme -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- COMING SOON HERO -->
  <section class="d-flex align-items-center justify-content-center text-center position-relative overflow-hidden" style="min-height: 100vh; background-color: var(--bg-primary);">
    <div class="hero-bg-overlay" style="background-image: url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1920&q=80'); opacity: 0.25;"></div>
    
    <div class="container position-relative z-2 py-5">
      <div style="max-width: 650px; margin: 0 auto;">
        
        <a href="index.html" class="navbar-brand-logo justify-content-center mb-4" style="font-size: 2.2rem;">
          <i class="bi bi-scissors text-gold me-2"></i>IRON <span>&</span> IVORY
        </a>

        <span class="section-label">Opening Winter 2026</span>
        <h1 class="display-font my-3" style="font-size: clamp(2.5rem, 5vw, 4rem);">
          A New Sanctuary of Refined Grooming.
        </h1>
        <p class="text-lead mb-5">
          We are preparing our second Flagship Grooming Studio in the Uptown Cultural District. Join our priority list for VIP launch invitations and complimentary founding member perks.
        </p>

        <!-- Newsletter Notify Form -->
        <form class="studio-interactive-form mb-5">
          <div class="d-flex flex-column flex-sm-row gap-2" style="max-width: 500px; margin: 0 auto;">
            <input type="email" class="studio-input" placeholder="Enter your email address..." required style="background: var(--bg-card);">
            <button type="submit" class="btn-primary-studio text-nowrap">
              Notify Me <i class="bi bi-arrow-right"></i>
            </button>
          </div>
          <div class="form-feedback-alert"></div>
        </form>

        <!-- Social & Direct Contact -->
        <div class="d-flex justify-content-center gap-4 text-muted fs-5">
          <a href="#" aria-label="Instagram" class="text-muted"><i class="bi bi-instagram"></i></a>
          <a href="#" aria-label="Facebook" class="text-muted"><i class="bi bi-facebook"></i></a>
          <a href="#" aria-label="Twitter" class="text-muted"><i class="bi bi-twitter-x"></i></a>
          <a href="#" aria-label="YouTube" class="text-muted"><i class="bi bi-youtube"></i></a>
        </div>

        <div class="mt-4">
          <a href="index.html" class="text-gold font-monospace text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.15em;">
            <i class="bi bi-arrow-left me-1"></i> Visit Existing Flagship Studio
          </a>
        </div>

      </div>
    </div>
  </section>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
